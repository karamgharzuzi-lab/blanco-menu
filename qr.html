<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLANCO — קוד סריקה לתפריט</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@400;500;600&family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F0E0D;
      --bg-gradient: radial-gradient(circle at top, #1E1B19 0%, #080807 100%);
      --text: #F3F1EB;
      --gold: #C5A85C;
      --gold-accent: #E5C97C;
      --card-bg: rgba(22, 21, 19, 0.72);
      --card-border: rgba(197, 168, 92, 0.25);
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Jost', 'Assistant', sans-serif;
      --muted: #A6A299;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* Screen view card container */
    .qr-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 50px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Elegant double border inside the card */
    .qr-container::before {
      content: '';
      position: absolute;
      top: 16px;
      bottom: 16px;
      left: 16px;
      right: 16px;
      border: 1px solid var(--gold);
      border-radius: 12px;
      pointer-events: none;
      opacity: 0.4;
    }

    .logo-img {
      max-width: 260px;
      width: 100%;
      height: auto;
      margin-bottom: 25px;
      display: block;
      position: relative;
      z-index: 2;
      filter: invert(0.08) sepia(0.1) saturate(2) hue-rotate(15deg);
    }

    .qr-frame {
      background: #FFFFFF;
      padding: 18px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .qr-code {
      display: block;
      width: 210px;
      height: 210px;
    }

    .scan-instruction {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-style: italic;
      font-weight: 500;
      color: var(--gold-accent);
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .scan-sub {
      font-size: 0.88rem;
      color: var(--muted);
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }

    .disclaimer-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.5px;
      position: relative;
      z-index: 2;
      background: linear-gradient(135deg, var(--gold-accent), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding: 8px 12px;
      border-top: 1px solid rgba(197, 168, 92, 0.15);
      border-bottom: 1px solid rgba(197, 168, 92, 0.15);
      width: 100%;
      max-width: 310px;
      text-align: center;
    }

    .camera-icon {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    /* Actions buttons for screen */
    .actions {
      display: flex;
      gap: 15px;
      margin-top: 30px;
      width: 100%;
      max-width: 440px;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-sans);
    }

    .btn-primary {
      background-color: var(--gold);
      color: #0F0E0D;
      border: 1px solid var(--gold);
    }

    .btn-primary:hover {
      background-color: var(--gold-accent);
      border-color: var(--gold-accent);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background-color: rgba(255,255,255,0.03);
      transform: translateY(-2px);
    }

    /* Print styles */
    @media print {
      body {
        background: #FFFFFF !important;
        color: #000000 !important;
        min-height: auto !important;
        padding: 0 !important;
      }

      .qr-container {
        background: #FFFFFF !important;
        border: none !important;
        box-shadow: none !important;
        max-width: 100% !important;
        padding: 40px 0 !important;
        margin: 0 auto !important;
      }

      .logo-img {
        filter: none !important;
      }

      .qr-container::before {
        border: 2px solid #000000 !important;
        top: 0 !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        border-radius: 0 !important;
      }

      .qr-frame {
        box-shadow: none !important;
        border-color: #000000 !important;
      }

      .actions {
        display: none !important;
      }

      .disclaimer-text {
        color: #000000 !important;
        background: none !important;
        -webkit-text-fill-color: initial !important;
        border-color: #000000 !important;
      }
    }
  </style>
</head>
<body>

  <div class="qr-container">
    <img src="images/logo.png" alt="BLANCO" class="logo-img">
    
    <div class="qr-frame">
      <!-- Generated dynamically based on domain origin -->
      <img class="qr-code" id="qrCodeImg" src="" alt="קוד לסריקת תפריט בלנקו">
    </div>
    
    <div class="scan-instruction">סרקו לצפייה בתפריט הדיגיטלי</div>
    <div class="scan-sub">פתחו את המצלמה במכשיר הנייד שלכם והפנו אותה לקוד כדי לצפות במנות ובמחירים המעודכנים ביותר</div>
    
    <div class="disclaimer-text">התמונות לא להמחשה זה באמת נראה כך!!</div>
    
    <div class="camera-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 18C14.7614 18 17 15.7614 17 13C17 10.2386 14.7614 8 12 8C9.23858 8 7 10.2386 7 13C7 15.7614 9.23858 18 12 18Z" stroke="#C5A85C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M23 19C23 19.5304 22.7893 20.0391 22.4142 20.4142C22.0391 20.7893 21.5304 21 21 21H3C2.46957 21 1.96086 20.7893 1.58579 20.4142C1.21071 20.0391 1 19.5304 1 19V9C1 8.46957 1.21071 7.96086 1.58579 7.58579C1.96086 7.21071 2.46957 7 3 7H7L9 4H15L17 7H21C21.5304 7 22.0391 7.21071 22.4142 7.58579C22.7893 7.96086 23 8.46957 23 9V19Z" stroke="#C5A85C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="window.print()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1);">
        <polyline points="6 9 6 2 18 2 18 9"></polyline>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
        <rect x="6" y="14" width="12" height="8"></rect>
      </svg>
      הדפסת כרטיס שולחן
    </button>
    <a href="index.html" class="btn btn-secondary">
      חזרה לתפריט
    </a>
  </div>

  <script type="module">
    document.addEventListener('DOMContentLoaded', () => {
      // Dynamic link assignment
      const currentUrl = window.location.origin + window.location.pathname.replace('qr.html', 'index.html');
      const qrImg = document.getElementById('qrCodeImg');
      
      if (qrImg) {
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(currentUrl)}&color=0f0e0d&bgcolor=ffffff`;
      }
    });
  </script>

</body>
</html>
