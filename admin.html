    let dishes = [];
    let visitsCount = 0;
    let currentFilterCategory = 'all';
    let currentSearchText = '';

    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function toast(m) {
      const t = $('#toast');
      t.textContent = m;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function getSecTitle(key) {
      const s = SECTIONS.find(x => x.key === key);
      return s ? s.title : key;
    }

    // Load category dropdown choices
    function loadCategoriesDropdown() {
      const select = $('#adminCategorySelect');
      select.innerHTML = '<option value="all">כל הקטגוריות</option>';
      SECTIONS.forEach(s => {
        select.innerHTML += `<option value="${s.key}">${esc(s.title)}</option>`;
      });
    }
    loadCategoriesDropdown();

    // ---- AUTH FLOW ----
    $('#signInBtn').addEventListener('click', async () => {
      $('#loginErr').textContent = '';
      const email = $('#email').value.trim();
      const password = $('#password').value;
      if (!email || !password) {
        $('#loginErr').textContent = 'נא להזין אימייל וסיסמה';
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        console.error(e);
        $('#loginErr').textContent = 'שגיאת כניסה: פרטים לא נכונים';
      }
    });

    $('#password').addEventListener('keydown', e => {
      if (e.key === 'Enter') $('#signInBtn').click();
    });

    $('#logoutBtn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, user => {
      if (user) {
        $('#loginView').classList.add('hidden');
        $('#adminView').classList.remove('hidden');
        loadAllData();
      } else {
        $('#adminView').classList.add('hidden');
        $('#loginView').classList.remove('hidden');
      }
    });

    // ---- LOAD DATA ----
    async function loadAllData() {
      try {
        // Fetch dishes
        const snap = await getDocs(collection(db, 'dishes'));
        dishes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        
        // Fetch dynamic visits count analytics (wrapped to prevent permission errors from blocking the dashboard)
        try {
          const visitsSnap = await getDocs(collection(db, 'visits'));
          visitsCount = visitsSnap.size;
        } catch (visitsErr) {
          console.warn('Visits collection read failed (permissions?):', visitsErr);
          visitsCount = 'N/A';
        }

        calculateDashboardMetrics();
        renderEditor();
      } catch (err) {
        console.error('Error fetching data: ', err);
        toast('שגיאה בטעינת הנתונים מהשרת');
      }
    }

    // Dashboard Statistics Calculation
    function calculateDashboardMetrics() {
      const active = dishes.filter(d => !d.archived);
      const archived = dishes.filter(d => d.archived);
      
      $('#statDishes').textContent = active.length;
      $('#statArchived').textContent = archived.length;
      $('#statVisits').textContent = visitsCount;

      // Photo coverage percentage calculation
      if (active.length > 0) {
        const withPhotos = active.filter(d => d.photo).length;
        const percentage = Math.round((withPhotos / active.length) * 100);
        $('#statPhotos').textContent = `${percentage}%`;
      } else {
        $('#statPhotos').textContent = '0%';
      }
    }

    function getNextOrderSequence(secKey) {
      const filtered = dishes.filter(d => d.section === secKey);
      return filtered.length ? Math.max(...filtered.map(d => d.order || 0)) + 1 : 0;
    }

    // Seeding trigger
    async function seedInitialDatabase() {
      const seedBtn = $('#seedBtn');
      if (seedBtn) {
        seedBtn.disabled = true;
        seedBtn.textContent = 'טוען מנות...';
      }
      try {
        const batch = writeBatch(db);
        SEED.forEach(d => {
          batch.set(doc(collection(db, 'dishes')), d);
        });
        await batch.commit();
        toast('התפריט נטען בהצלחה');
        await loadAllData();
      } catch (err) {
        console.error(err);
        toast('שגיאה בטעינה ראשונית');
      }
    }

    // CRUD Actions
    async function createNewDish(secKey) {
      const key = secKey || SECTIONS[0].key;
      let defaultName = 'מנה חדשה';
      if (key === 'drinks') defaultName = 'שתייה חדשה';
      else if (key === 'alcohol') defaultName = 'שתייה חריפה חדשה';

      try {
        await addDoc(collection(db, 'dishes'), {
          section: key,
          name: defaultName,
          price: '',
          desc: '',
          note: '',
          photo: '',
          order: getNextOrderSequence(key),
          isVegetarian: false,
          isSpicy: false,
          isGlutenFree: false
        });
        toast('מנה חדשה נוספה לתפריט');
        await loadAllData();
      } catch (err) {
        console.error(err);
        toast('שגיאה בהוספת מנה');
      }
    }

    // Quick Add Button listener
    $('#headerAddDishBtn').addEventListener('click', () => {
      const currentSelectedCategory = $('#adminCategorySelect').value;
      const targetCategory = currentSelectedCategory !== 'all' ? currentSelectedCategory : SECTIONS[0].key;
      createNewDish(targetCategory);
    });

    async function saveEditedDish(id, cardElement) {
      const targetSec = cardElement.querySelector('.f-section').value;
      const d = dishes.find(x => x.id === id);
      const categoryChanged = d && d.section !== targetSec;

      const updatedFields = {
        name: cardElement.querySelector('.f-name').value.trim(),
        price: cardElement.querySelector('.f-price').value.trim(),
        desc: cardElement.querySelector('.f-desc').value.trim(),
        note: cardElement.querySelector('.f-note').value.trim(),
        section: targetSec,
        isVegetarian: cardElement.querySelector('.f-veg').checked,
        isSpicy: cardElement.querySelector('.f-spicy').checked,
        isGlutenFree: cardElement.querySelector('.f-gf').checked
      };

      try {
        await updateDoc(doc(db, 'dishes', id), updatedFields);
        toast('השינויים נשמרו בהצלחה');
        
        // Update local cache
        if (d) {
          Object.assign(d, updatedFields);
        }
        
        calculateDashboardMetrics();
        
        if (categoryChanged) {
          await loadAllData();
        }
      } catch (err) {
        console.error(err);
        toast('שגיאה בשמירת השינויים');
      }
    }

    async function deleteDishPermanently(id) {
      if (!confirm('האם אתה בטוח שברצונך למחוק את המנה לצמיתות? פעולה זו אינה ניתנת לביטול.')) return;
      try {
        await deleteDoc(doc(db, 'dishes', id));
        toast('המנה נמחקה לצמיתות');
        await loadAllData();
      } catch (err) {
        console.error(err);
        toast('שגיאה במחיקת המנה');
      }
    }

    async function toggleArchiveDish(id, archiveState) {
      try {
        await updateDoc(doc(db, 'dishes', id), { archived: archiveState });
        toast(archiveState ? 'המנה הועברה לארכיון' : 'המנה הוחזרה לתפריט הפעיל');
        await loadAllData();
      } catch (err) {
        console.error(err);
        toast('שגיאה בשינוי מצב הארכיון');
      }
    }

    // Photo Storage Uploader (with Drag and Drop support)
    async function uploadDishPhoto(id, file, cardElement) {
      const statusLbl = cardElement.querySelector('.up-status');
      statusLbl.textContent = 'מעלה תמונה...';
      
      try {
        // Clean special characters in filename
        const safeName = Date.now() + '_' + file.name.replace(/[^\w.\-]/g, '_');
        const storageRef = ref(storage, `dishes/${id}/${safeName}`);
        
        await uploadBytes(storageRef, file);
        const downloadUrl = await getDownloadURL(storageRef);
        
        await updateDoc(doc(db, 'dishes', id), { photo: downloadUrl });
        
        cardElement.querySelector('.thumb').style.backgroundImage = `url("${downloadUrl}")`;
        const d = dishes.find(x => x.id === id);
        if (d) d.photo = downloadUrl;
        
        statusLbl.textContent = '✓ תמונה עודכנה';
        calculateDashboardMetrics();
        toast('תמונת מנה עודכנה בהצלחה');
      } catch (err) {
        console.error(err);
        statusLbl.textContent = 'שגיאה בהעלאה';
        toast('שגיאה בהעלאת קובץ');
      }
    }

    // Resequence dishes sorting orders
    async function moveDishOrder(id, step) {
      const d = dishes.find(x => x.id === id);
      if (!d) return;

      const siblings = dishes
        .filter(x => x.section === d.section && !x.archived)
        .sort((a, b) => (a.order || 0) - (b.order || 0));

      const currentIndex = siblings.findIndex(x => x.id === id);
      const targetIndex = currentIndex + step;
      if (targetIndex < 0 || targetIndex >= siblings.length) return;

      const dishA = siblings[currentIndex];
      const dishB = siblings[targetIndex];

      const orderA = dishA.order || 0;
      const orderB = dishB.order || 0;

      try {
        const batch = writeBatch(db);
        batch.update(doc(db, 'dishes', dishA.id), { order: orderB });
        batch.update(doc(db, 'dishes', dishB.id), { order: orderA });
        await batch.commit();
        await loadAllData();
      } catch (err) {
        console.error(err);
        toast('שגיאה בשינוי סדר המנות');
      }
    }

    // ---- RENDER COMPONENT ELEMENT ----
    function createDishEditCard(d) {
      const card = document.createElement('div');
      card.className = `ed-card ${d.archived ? 'archived' : ''}`;
      card.dataset.id = d.id;

      const thumbStyle = d.photo ? `background-image: url('${esc(d.photo)}')` : '';
      const isArchived = !!d.archived;

      const originalCategoryLabel = isArchived 
        ? `<div style="font-size: 0.8rem; color: var(--gold); margin-bottom: 8px;">קטגוריה בארכיון: ${esc(getSecTitle(d.section))}</div>` 
        : '';

      const archiveToggleBtn = isArchived 
        ? '<button class="btn mini save restore">החזר לתפריט</button>' 
        : '<button class="btn ghost mini archive">העבר לארכיון</button>';

      const sortingControls = isArchived 
        ? '' 
        : '<button class="btn ghost mini up">↑</button><button class="btn ghost mini down">↓</button>';

      const deleteBtnText = isArchived ? 'מחק לצמיתות' : 'מחיקה';

      let selectOptionsHtml = `<select class="f-section">`;
      SECTIONS.forEach(s => {
        selectOptionsHtml += `<option value="${s.key}" ${s.key === d.section ? 'selected' : ''}>${esc(s.title)}</option>`;
      });
      selectOptionsHtml += `</select>`;

      card.innerHTML = `
        ${originalCategoryLabel}
        <div class="ed-row">
          <input class="f-name" value="${esc(d.name)}" placeholder="שם המנה">
          <input class="f-price" value="${esc(d.price)}" placeholder="מחיר (למשל: ₪75)">
        </div>
        <div class="ed-row" style="align-items: center;">
          <span style="font-size: 0.85rem; color: var(--text-muted); margin-left: 8px; flex-shrink: 0;">קטגוריה:</span>
          ${selectOptionsHtml}
        </div>
        <textarea class="f-desc" placeholder="תיאור המנה (רכיבים, אלרגנים, דרגת הכנה...)">${esc(d.desc)}</textarea>
        <input class="f-note" value="${esc(d.note)}" placeholder="הערה (למשל: תוספת חזה עוף ₪12)">
        <div class="note-hint">לכמה הערות הפרד עם הסימן | · לכמה מחירים (גדול/קטן) הפרד עם ·</div>
        
        <!-- Dietary flags options toggles -->
        <div class="dietary-options-row">
          <label class="dietary-checkbox-label">
            <input type="checkbox" class="f-veg" ${d.isVegetarian ? 'checked' : ''}>
            <span>🍃 צמחוני</span>
          </label>
          <label class="dietary-checkbox-label">
            <input type="checkbox" class="f-spicy" ${d.isSpicy ? 'checked' : ''}>
            <span>🌶️ פיקנטי</span>
          </label>
          <label class="dietary-checkbox-label">
            <input type="checkbox" class="f-gf" ${d.isGlutenFree ? 'checked' : ''}>
            <span>🌾 ללא גלוטן</span>
          </label>
        </div>

        <div class="ed-photo" id="dropzone-${d.id}">
          <div class="thumb" style="${thumbStyle}"></div>
          <label class="btn ghost mini">
            בחר תמונה
            <input type="file" accept="image/*" class="f-file" hidden>
          </label>
          <span class="up-status">או גרור קובץ לכאן</span>
        </div>

        <div class="ed-actions">
          <button class="btn mini save">שמור מנה</button>
          ${archiveToggleBtn}
          ${sortingControls}
          <span class="spacer"></span>
          <button class="btn danger mini del">${deleteBtnText}</button>
        </div>
      `;

      // Event triggers binding
      card.querySelector('.save').addEventListener('click', () => saveEditedDish(d.id, card));
      card.querySelector('.del').addEventListener('click', () => deleteDishPermanently(d.id));

      if (!isArchived) {
        card.querySelector('.up').addEventListener('click', () => moveDishOrder(d.id, -1));
        card.querySelector('.down').addEventListener('click', () => moveDishOrder(d.id, 1));
        card.querySelector('.archive').addEventListener('click', () => toggleArchiveDish(d.id, true));
      } else {
        card.querySelector('.restore').addEventListener('click', () => toggleArchiveDish(d.id, false));
      }

      // Input uploader
      const fileInput = card.querySelector('.f-file');
      fileInput.addEventListener('change', e => {
        if (e.target.files[0]) {
          uploadDishPhoto(d.id, e.target.files[0], card);
        }
      });

      // Drag and Drop implementation
      const dropzone = card.querySelector(`#dropzone-${d.id}`);
      
      dropzone.addEventListener('dragover', e => {
        e.preventDefault();
        dropzone.style.borderColor = 'var(--gold)';
        dropzone.style.background = 'rgba(197, 168, 92, 0.05)';
      });

      dropzone.addEventListener('dragleave', () => {
        dropzone.style.borderColor = 'var(--border-color)';
        dropzone.style.background = 'transparent';
      });

      dropzone.addEventListener('drop', e => {
        e.preventDefault();
        dropzone.style.borderColor = 'var(--border-color)';
        dropzone.style.background = 'transparent';
        
        const files = e.dataTransfer.files;
        if (files.length > 0 && files[0].type.startsWith('image/')) {
          uploadDishPhoto(d.id, files[0], card);
        } else {
          toast('אנא גרור קובץ תמונה בלבד');
        }
      });

      return card;
    }

    // ---- RENDER LISTS VIEW ----
    function renderEditor() {
      const root = $('#editorRoot');
      root.innerHTML = '';

      if (!dishes.length) {
        const box = document.createElement('div');
        box.className = 'seedbox';
        box.innerHTML = `
          <p>בסיס הנתונים של התפריט ריק כעת. טען את 50 מנות ברירת המחדל כדי להתחיל במהירות.</p>
          <button class="btn" id="seedBtn">טען את תפריט הבית</button>
        `;
        root.appendChild(box);
        $('#seedBtn').addEventListener('click', seedInitialDatabase);
        return;
      }

      // Apply category filter and search texts filters
      const filtered = dishes.filter(d => {
        const matchesCategory = currentFilterCategory === 'all' || d.section === currentFilterCategory;
        const matchesSearch = !currentSearchText || 
          d.name.toLowerCase().includes(currentSearchText.toLowerCase()) ||
          (d.desc && d.desc.toLowerCase().includes(currentSearchText.toLowerCase()));
        
        return matchesCategory && matchesSearch;
      });

      // Split into active and archived lists
      const activeList = filtered.filter(d => !d.archived);
      const archivedList = filtered.filter(d => d.archived);

      // Render active sections per category
      SECTIONS.forEach(sec => {
        // Skip categories that don't match Category Filter dropdown if filter is active
        if (currentFilterCategory !== 'all' && currentFilterCategory !== sec.key) return;

        const secDishes = activeList.filter(d => d.section === sec.key).sort((a,b) => (a.order || 0) - (b.order || 0));
        
        // Hide category headers in render list if search queries returned empty rows
        if (currentSearchText && !secDishes.length) return;

        const sectionBlock = document.createElement('div');
        sectionBlock.className = 'ed-section';

        const head = document.createElement('div');
        head.className = 'ed-sec-head';
        
        let addBtnText = '+ מנה';
        if (sec.key === 'drinks') addBtnText = '+ שתייה';
        else if (sec.key === 'alcohol') addBtnText = '+ שתייה חריפה';

        head.innerHTML = `
          <h3>${esc(sec.title)}</h3>
          <button class="btn ghost mini add">${addBtnText}</button>
        `;
        
        head.querySelector('.add').addEventListener('click', () => createNewDish(sec.key));
        sectionBlock.appendChild(head);

        if (secDishes.length === 0) {
          const emptyInfo = document.createElement('p');
          emptyInfo.style.color = 'var(--text-muted)';
          emptyInfo.style.fontSize = '0.82rem';
          emptyInfo.style.padding = '8px 4px';
          emptyInfo.textContent = 'אין מנות בקטגוריה זו.';
          sectionBlock.appendChild(emptyInfo);
        } else {
          secDishes.forEach(d => sectionBlock.appendChild(createDishEditCard(d)));
        }

        root.appendChild(sectionBlock);
      });

      // Render archived block
      if (archivedList.length > 0) {
        const archivedBlock = document.createElement('div');
        archivedBlock.className = 'ed-section';
        archivedBlock.style.marginTop = '48px';
        archivedBlock.style.paddingTop = '24px';
        archivedBlock.style.borderTop = '2px dashed var(--gold)';

        const head = document.createElement('div');
        head.className = 'ed-sec-head';
        head.innerHTML = `<h3 style="color: var(--danger)">ארכיון מנות (לא מוצגות בתפריט)</h3>`;
        archivedBlock.appendChild(head);

        archivedList.sort((a, b) => {
          const secA = SECTIONS.findIndex(s => s.key === a.section);
          const secB = SECTIONS.findIndex(s => s.key === b.section);
          if (secA !== secB) return secA - secB;
          return (a.order || 0) - (b.order || 0);
        });

        archivedList.forEach(d => archivedBlock.appendChild(createDishEditCard(d)));
        root.appendChild(archivedBlock);
      }
    }

    // Input handlers
    $('#adminSearchInput').addEventListener('input', e => {
      currentSearchText = e.target.value.trim();
      renderEditor();
    });

    $('#adminCategorySelect').addEventListener('change', e => {
      currentFilterCategory = e.target.value;
      renderEditor();
    });
  </script>
</body>
</html>
